name: docker-push

on:
  workflow_dispatch:
  # 打 tag（v1.3.4 之类）时自动出镜像；不想自动发布就注释掉这一段
  push:
    tags:
      - 'v*'

# 只读取代码，写包权限给 GITHUB_TOKEN 推 ghcr.io
permissions:
  contents: read
  packages: write

# 同一分支/tag 同时只跑一个，避免两个构建交叉推送
concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号来自 service/assets/version（格式：dbVersion|appVersion）
      - name: Read version from file
        run: |
          VERSION="$(cut -d '|' -f 2 ./service/assets/version | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 service/assets/version 解析版本号"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "镜像版本: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 会把仓库名自动转小写，并写入
      # org.opencontainers.image.source 标签 —— 这个标签决定 GHCR 包能不能
      # 和本仓库建立关联（关联不上，GITHUB_TOKEN 推送就会报 write_package）
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=sun-panel-v2
            org.opencontainers.image.description=Sun-Panel with backup & restore

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=22.10.0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存落在 Actions 缓存，第二次构建从 ~13 分钟降到 1-2 分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max
