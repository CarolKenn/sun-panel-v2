name: ci

# 之前仓库只有手动触发的发布流程，日常改动（push / PR）完全没有校验。
# 这个工作流负责「代码还能不能编译」，不做发布。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (lint / type-check / build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22.10.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.10.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 存量代码还有大量 @antfu 规则告警，先不阻塞合并；
      # 等清理干净后把 continue-on-error 去掉即可
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  service:
    name: Backend (go build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: service/go.sum

      # 与 Dockerfile 中后端构建步骤保持一致
      - name: Install go-bindata tools
        run: |
          go install github.com/go-bindata/go-bindata/...@latest
          go install github.com/elazarl/go-bindata-assetfs/...@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # go-bindata-assetfs 除了生成 assets/bindata.go，还会在 CWD 落一个
      # 没有 package 声明的 bindata.go（assetfs 辅助片段，项目只用到
      # assets.Asset），后者会让 go build ./... 直接失败，必须清掉。
      # 先生成前删掉旧的 assets/bindata.go，避免它被自己再扫一遍。
      - name: Generate embedded assets
        working-directory: service
        run: |
          rm -f assets/bindata.go
          go-bindata-assetfs -o=assets/bindata.go -pkg=assets assets/...
          rm -f bindata.go

      # 先全量编译所有包，再产出二进制。
      # 只编 main.go 会漏掉「某个文件语法/包名写错但不被 main 引用」的情况
      # （曾经就有一个没有 package 声明的 service/bindata.go 长期没被发现）
      - name: Build all packages
        working-directory: service
        env:
          CGO_ENABLED: '1'
          GOFLAGS: '-buildvcs=false'
        run: go build ./...

      - name: Build binary
        working-directory: service
        env:
          CGO_ENABLED: '1'
          GOFLAGS: '-buildvcs=false'
        run: go build -o sun-panel --ldflags="-X sun-panel/global.RUNCODE=release" main.go
